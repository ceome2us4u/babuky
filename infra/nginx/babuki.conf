# Babuki reverse proxy — two upstreams, mirroring the apps/web (frontend)
# + apps/api (backend) split. Wildcard TLS is issued via Let's Encrypt
# DNS-01 (certbot-dns-route53), not HTTP-01, so no separate ACME
# webroot/challenge block is needed here. The *.babuki.com wildcard SAN
# also covers api.babuki.com (one label), so no separate cert is needed
# for it either.

server {
    listen 80;
    listen [::]:80;
    server_name babuki.com *.babuki.com;
    return 301 https://$host$request_uri;
}

# api.babuki.com is an exact server_name match, which Nginx always prefers
# over the *.babuki.com wildcard below regardless of block order — so this
# takes api.babuki.com traffic and only api.babuki.com traffic.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.babuki.com;

    ssl_certificate     /etc/letsencrypt/live/babuki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babuki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Frontend: the bare domain and every vendor subdomain (slug.babuki.com).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name babuki.com *.babuki.com;

    ssl_certificate     /etc/letsencrypt/live/babuki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babuki.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # $host preserves the vendor subdomain so the app can resolve it later.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
